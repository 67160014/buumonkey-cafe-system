<!DOCTYPE html><html lang="th"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Buumonkey Cafe</title>
<!-- Google Fonts: Prompt for authentic Thai POS typography -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS CDN with Forms & Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for Espresso Palette -->
<script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'sans-serif'],
          },
          colors: {
            espresso: {
              900: '#1F140E',
              850: '#261912',
              800: '#2F1E16',
              700: '#3D281E',
              600: '#53382B',
              500: '#754F3D',
              200: '#D5C4B8',
              100: '#EBE2DC',
              50: '#F7F4F0',
            },
            warmbg: '#FAF7F2',
            creamborder: '#E8DFC8',
            coffeeAccent: '#A46338',
            amberAlert: '#D97706',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-scrollbars">
    /* Subtle custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F2ECE4;
    }
    ::-webkit-scrollbar-thumb {
      background: #C4B5A5;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #8F7664;
    }
  </style>
<style>
  #catalog-container {
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    visibility: hidden;
  }
  #pos-main-content {
    visibility: hidden;
  }
  #catalog-container > div {
    min-width: 0;
  }
  #catalog-container h3,
  #catalog-container p {
    overflow-wrap: anywhere;
  }
  #catalog-container button {
    white-space: nowrap;
  }
</style>
<meta content="web_dashboard" name="shell-type"></head>
<body class="bg-[#F8F5F0] text-stone-800 font-sans antialiased min-h-screen flex flex-col">
<!-- BEGIN: TopBar -->
<header class="bg-[#2A1B14] text-amber-50 h-16 px-6 flex items-center justify-between shadow-md border-b border-[#3E291F] shrink-0 select-none">
<!-- Brand & Subtitle -->
<div class="flex items-center space-x-4">
<div class="w-10 h-10 rounded-xl bg-[#4A3226] border border-[#5F4032] flex items-center justify-center text-amber-300 shadow-inner">
<!-- Coffee Cup SVG Icon -->
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M17 8h1a4 4 0 1 1 0 8h-1"></path>
<path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
<line x1="6" x2="6" y1="2" y2="4"></line>
<line x1="10" x2="10" y1="2" y2="4"></line>
<line x1="14" x2="14" y1="2" y2="4"></line>
</svg>
</div>
<div>
<div class="flex items-center space-x-2">
<h1 class="font-bold text-lg tracking-wide text-white">Buumonkey Cafe</h1>
</div>
</div>
</div>
<!-- Center/Right Branch and Shift Info -->
<div class="flex items-center space-x-4">
<!-- Branch Selector Pill -->
<div class="flex items-center bg-[#3D281E] border border-[#54382A] rounded-lg px-3 py-1.5 text-xs text-stone-200">
<svg class="w-4 h-4 mr-1.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<label class="flex items-center gap-1.5">สาขา:
<select id="branch-select" aria-label="เลือกสาขา" class="max-w-40 rounded-md border border-[#654632] bg-[#2A1B14] py-1 pl-2 pr-7 text-xs font-medium text-white focus:border-amber-400 focus:ring-amber-400"></select>
</label>
</div>
<!-- Staff & System Date -->
<div class="flex items-center bg-[#362319] border border-[#4A3226] rounded-lg px-3 py-1.5 text-xs text-stone-300">
<label class="flex items-center gap-1.5 whitespace-nowrap">แคชเชียร์:
<select id="cashier-select" aria-label="เลือกแคชเชียร์" class="max-w-40 rounded-md border border-[#654632] bg-[#2A1B14] py-1 pl-2 pr-7 text-xs font-medium text-white focus:border-amber-400 focus:ring-amber-400"></select>
</label>
</div>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainContainer -->
<div class="flex-1 flex overflow-hidden">
<!-- BEGIN: LeftSidebarNav -->
<aside class="w-64 bg-[#2A1B14] text-stone-300 flex flex-col justify-between shrink-0 border-r border-[#3E291F] select-none">
<nav class="p-4 space-y-1.5">
<a class="flex items-center space-x-3 px-3.5 py-3 rounded-xl font-medium bg-[#54382B] text-amber-200 border-l-4 border-amber-400 shadow-sm transition" href="#"><svg class="w-5 h-5 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg><span class="text-sm font-semibold">สั่งออเดอร์</span></a>
<!-- Active Page: จัดการเมนู -->
<a class="flex items-center space-x-3 px-3.5 py-3 rounded-xl font-medium text-stone-300 hover:text-white hover:bg-[#3D281E] transition" href="#"><svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg><span class="text-sm">จัดการเมนู</span><span class="ml-auto text-xs bg-stone-800 text-stone-400 px-2 py-0.5 rounded-full font-normal" data-menu-total-count>0</span></a>
<a class="flex items-center space-x-3 px-3.5 py-3 rounded-xl font-medium text-stone-300 hover:text-white hover:bg-[#3D281E] transition" href="#">
<svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-sm">รายงานยอดขาย</span>
</a>
<a class="flex items-center space-x-3 px-3.5 py-3 rounded-xl font-medium text-stone-300 hover:text-white hover:bg-[#3D281E] transition" href="#">
<svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-sm">ประวัติใบเสร็จรับเงิน</span>
</a>
</nav>
</aside>
<!-- END: LeftSidebarNav -->
<!-- BEGIN: MainContentArea -->
<main id="pos-main-content" class="flex-1 overflow-y-auto p-6 lg:p-8 space-y-6"><div class="flex flex-col w-full space-y-6">
<!-- Main POS Grid: 2 Columns (Catalog on Left 65%, Cart on Right 35%) -->
<div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
<!-- LEFT: Menu Selection Catalog (lg:col-span-7) -->
<div class="lg:col-span-7 space-y-4">
<div class="flex items-center justify-between">
<div>
<h2 class="text-lg font-bold text-stone-900 tracking-tight">เมนูเครื่องดื่ม</h2>
</div>
<div class="flex items-center space-x-1.5 bg-stone-200/60 p-1 rounded-xl text-xs font-medium text-stone-600">
</div>
</div>
<!-- Beverage Item Cards Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3.5" id="catalog-container">
</div>
</div>
<!-- RIGHT: Cart Table & Payment Terminal (lg:col-span-5) -->
<div class="lg:col-span-5 space-y-4">
<div class="bg-white rounded-2xl p-5 shadow-sm flex flex-col justify-between space-y-5">
<!-- Cart Header -->
<div class="flex items-center justify-between pb-3">
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-stone-700">receipt_long</span>
<h3 class="font-bold text-stone-900 text-base">รายการที่เลือก</h3>
</div>
<span class="text-xs bg-stone-100 text-stone-700 px-2.5 py-1 rounded-full font-medium" id="cart-item-count">0 แก้ว</span>
</div>
<!-- Cart Table (Clean Minimalist List) -->
<div id="cart-items" class="space-y-2"></div>

<!-- Total Calculation Box -->
<div class="bg-stone-100/70 rounded-2xl p-4">
<div class="flex items-baseline justify-between">
<div>
<span class="text-xs font-semibold text-stone-500 uppercase tracking-wider block">รวมทั้งสิ้น (Total)</span>
</div>
<div class="text-right">
<span class="text-3xl font-extrabold text-stone-900 tracking-tight" id="cart-total">0.00</span>
<span class="text-sm font-semibold text-stone-600 ml-1">บาท</span>
</div>
</div>
</div>
<!-- Payment Method Selection -->
<div class="space-y-2">
<label class="text-xs font-semibold text-stone-700 block">เลือกช่องทางชำระเงิน</label>
<div class="grid grid-cols-2 gap-2">
<!-- Option Cash -->
<label class="relative flex items-center p-3 rounded-xl cursor-pointer bg-stone-50 hover:bg-stone-100 transition">
<input checked="" class="text-stone-900 focus:ring-stone-800" name="payment_method" onchange="togglePayment(this.value)" type="radio" value="cash">
<div class="ml-2.5 flex items-center space-x-1.5">
<span class="material-symbols-outlined text-stone-700 text-lg">payments</span>
<span class="text-xs font-semibold text-stone-800">เงินสด (Cash)</span>
</div>
</label>
<!-- Option PromptPay QR -->
<label class="relative flex items-center p-3 rounded-xl cursor-pointer bg-stone-50 hover:bg-stone-100 transition">
<input class="text-stone-900 focus:ring-stone-800" name="payment_method" onchange="togglePayment(this.value)" type="radio" value="qr">
<div class="ml-2.5 flex items-center space-x-1.5">
<span class="material-symbols-outlined text-stone-700 text-lg">qr_code_scanner</span>
<span class="text-xs font-semibold text-stone-800">QR Code</span>
</div>
</label>
</div>
</div>
<!-- Primary Action Buttons -->
<div class="space-y-2 pt-1">
<button id="confirm-order-button" class="w-full py-3.5 bg-stone-900 hover:bg-stone-800 text-white rounded-xl font-semibold text-sm flex items-center justify-center space-x-2 transition shadow-md active:scale-98" onclick="confirmOrder()">
<span class="material-symbols-outlined text-lg">check_circle</span>
<span id="confirm-btn-label" class="">ยืนยันออเดอร์</span>
</button>
<p id="order-status" class="hidden text-sm" role="status" aria-live="polite"></p>
<button class="w-full py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-600 rounded-xl text-xs font-medium transition active:scale-98 flex items-center justify-center space-x-1" onclick="clearCart()">
<span class="material-symbols-outlined text-base">restart_alt</span>
<span class="">ยกเลิก</span>
</button>
</div>
</div>
</div>
</div>
<!-- Spec Footnote / Requirement Traceability -->
</div>
</div>
</main>
<!-- END: MainContentArea -->
</div>
<!-- END: MainContainer -->


</body></html>
<script src='/index-ui.js?v=16'></script>
