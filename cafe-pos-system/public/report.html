<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Buumonkey Cafe</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <style>
    body {
      font-family: Prompt, sans-serif !important;
    }
    input, select, button, textarea {
      font-family: Prompt, sans-serif !important;
    }
  </style>
</head>
<body class="bg-[#F8F5F0] text-stone-800 font-sans antialiased min-h-screen flex flex-col">
  <header class="bg-[#2A1B14] text-amber-50 h-16 px-6 flex items-center justify-between shadow-md border-b border-[#3E291F] shrink-0 select-none">
    <div class="flex items-center space-x-4">
    <div class="w-10 h-10 rounded-xl bg-[#4A3226] border border-[#5F4032] flex items-center justify-center text-amber-300 shadow-inner">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" x2="6" y1="2" y2="4"></line><line x1="10" x2="10" y1="2" y2="4"></line><line x1="14" x2="14" y1="2" y2="4"></line></svg>
      </div>
      <h1 class="text-lg font-bold tracking-wide text-white">Buumonkey Cafe</h1>
    </div>
    <div class="flex items-center space-x-4">
      <div class="flex items-center bg-[#3D281E] border border-[#54382A] rounded-lg px-3 py-1.5 text-xs text-stone-200">
        <svg class="w-4 h-4 mr-1.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
        <span class="text-xs flex items-center gap-1">สาขา: <span id="report-header-branch" class="text-white font-medium">ทุกสาขา</span></span>
      </div>
      <div class="hidden md:flex items-center bg-[#362319] border border-[#4A3226] rounded-lg px-3 py-1.5 text-xs text-stone-300 space-x-3">
        <div class="flex items-center gap-1.5">
          <span class="shrink-0">พนักงาน: <span class="text-white font-medium">cashier 1</span></span>
        </div>
      </div>
    </div>
  </header>
  <div class="flex min-h-[calc(100vh-4rem)]">
    <aside class="w-64 bg-[#2A1B14] text-stone-300 flex flex-col justify-between shrink-0 border-r border-[#3E291F] select-none">
      <nav class="p-4 space-y-1.5">
        <a href="/" class="flex items-center space-x-3 rounded-xl px-3.5 py-3 font-medium text-stone-300 hover:text-white hover:bg-[#3D281E] transition">
          <svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
          <span class="text-sm">สั่งออเดอร์</span>
        </a>
        <a href="/menu.html" class="flex items-center space-x-3 rounded-xl px-3.5 py-3 font-medium text-stone-300 hover:text-white hover:bg-[#3D281E] transition">
          <svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
          <span class="text-sm">จัดการเมนู</span><span class="ml-auto text-xs bg-stone-800 text-stone-400 px-2 py-0.5 rounded-full font-normal" data-menu-total-count>0</span>
        </a>
        <a href="/report.html" class="flex items-center space-x-3 rounded-xl bg-[#54382B] text-amber-200 border-l-4 border-amber-400 shadow-sm transition px-3.5 py-3">
          <svg class="w-5 h-5 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
          <span class="text-sm font-semibold">รายงานยอดขาย</span>
        </a>
        <a href="/receipt.html" class="flex items-center space-x-3 rounded-xl px-3.5 py-3 font-medium text-stone-300 hover:text-white hover:bg-[#3D281E] transition">
          <svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
          <span class="text-sm">ประวัติใบเสร็จรับเงิน</span>
        </a>
      </nav>
    </aside>
    <main class="flex-1 overflow-y-auto p-6 lg:p-8 space-y-6">
      <div>
        <h2 class="text-2xl font-bold text-stone-900">รายงานยอดขาย</h2>
      </div>
      <section class="rounded-2xl border border-stone-200 bg-white p-5 shadow-sm">
        <div class="grid gap-4 md:grid-cols-4 md:items-end">
          <label class="text-sm">สาขา
            <select id="branch-filter" class="mt-1 block w-full rounded-lg border-stone-300 text-sm"></select>
          </label>
          <label class="text-sm">วันที่เริ่มต้น
            <input id="start-date" type="date" class="mt-1 block w-full rounded-lg border-stone-300 text-sm">
          </label>
          <label class="text-sm">วันที่สิ้นสุด
            <input id="end-date" type="date" class="mt-1 block w-full rounded-lg border-stone-300 text-sm">
          </label>
          <button id="load-report" class="rounded-lg bg-[#2A1B14] px-4 py-2.5 text-sm font-medium text-white hover:bg-[#3D281E]">ดูรายงาน</button>
        </div>
        <p id="report-error" class="mt-3 hidden text-sm text-rose-600"></p>
      </section>
      <section class="grid gap-4 sm:grid-cols-3">
        <div class="rounded-xl border border-stone-200 bg-white p-4"><p class="text-xs text-stone-500">จำนวนออเดอร์</p><p id="order-count" class="mt-1 text-2xl font-bold">0</p></div>
        <div class="rounded-xl border border-stone-200 bg-white p-4"><p class="text-xs text-stone-500">จำนวนสินค้าที่ขาย</p><p id="item-quantity" class="mt-1 text-2xl font-bold">0</p></div>
        <div class="rounded-xl border border-stone-200 bg-white p-4"><p class="text-xs text-stone-500">ยอดขายรวม</p><p id="total-sales" class="mt-1 text-2xl font-bold">฿0.00</p></div>
      </section>
      <section class="overflow-hidden rounded-2xl border border-stone-200 bg-white shadow-sm">
        <div class="border-b border-stone-200 px-5 py-4"><h3 class="font-semibold">ยอดขายแยกตามเมนู</h3></div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-stone-50 text-xs text-stone-500"><tr><th class="px-5 py-3">เมนู</th><th class="px-4 py-3">สาขา</th><th class="px-4 py-3 text-right">จำนวนที่ขาย</th><th class="px-5 py-3 text-right">ยอดขาย</th></tr></thead>
            <tbody id="sales-items" class="divide-y divide-stone-100"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="/report-ui.js?v=6"></script>
</body>
</html>
